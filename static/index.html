<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Linux 智能监控 + 区块链存证</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 1200px; width: 100%; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .card h3 { color: #94a3b8; font-weight: 400; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        #chart { width: 100%; height: 320px; }
        .stats { display: flex; justify-content: space-around; padding: 12px 0; }
        .stats .label { font-size: 14px; color: #64748b; }
        .stats .value { font-size: 22px; font-weight: bold; color: #38bdf8; }
        .stats .value.memory { color: #a78bfa; }
        .stats .value.disk { color: #f59e0b; }
        .log-list { max-height: 200px; overflow-y: auto; font-size: 13px; background: #0f172a; border-radius: 8px; padding: 8px; }
        .log-list .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; color: #cbd5e1; word-break: break-all; }
        .log-list .log-entry .time { color: #64748b; margin-right: 8px; }
        .alert-box { padding: 12px; border-radius: 8px; margin-top: 8px; text-align: center; font-weight: bold; }
        .alert-safe { background: #064e3b; color: #34d399; }
        .alert-danger { background: #7f1d1d; color: #f87171; }
        .badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 12px; }
        .badge.warn { background: #92400e; color: #fbbf24; }
        .badge.ok { background: #065f46; color: #34d399; }
        .badge.info { background: #1e3a5f; color: #60a5fa; }
        .mt-2 { margin-top: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .blockchain-list { max-height: 220px; overflow-y: auto; font-size: 13px; background: #0f172a; border-radius: 8px; padding: 8px; }
        .blockchain-list .block-entry { padding: 8px 0; border-bottom: 1px solid #1e293b; font-family: monospace; }
        .block-entry .idx { color: #60a5fa; font-weight: bold; }
        .block-entry .hash { color: #34d399; font-size: 12px; word-break: break-all; }
        .block-entry .data { color: #fbbf24; word-break: break-all; }
        .btn { background: #3b82f6; border: none; color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #2563eb; transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align:center;font-weight:400;color:#94a3b8;">📊 Linux 智能监控 · 区块链存证</h1>
    <div class="stats">
        <div><div class="label">🟦 CPU</div><div class="value" id="cpu-latest">--%</div></div>
        <div><div class="label">🟪 内存</div><div class="value memory" id="mem-latest">--%</div></div>
        <div><div class="label">🟨 磁盘</div><div class="value disk" id="disk-latest">--%</div></div>
        <div><div class="label">📅 最新时间</div><div class="value" id="time-latest" style="font-size:16px;">--</div></div>
    </div>

    <div class="card"><div id="chart"></div></div>

    <div class="grid">
        <div class="card">
            <div class="flex-between"><h3>🤖 AI 磁盘预测</h3><span id="predict-status" class="badge ok">等待数据</span></div>
            <div id="predict-content" style="font-size:15px;color:#cbd5e1;">正在获取预测数据...</div>
        </div>
        <div class="card">
            <div class="flex-between"><h3>⚠️ 异常日志</h3><span id="log-count" class="badge ok">0 条</span></div>
            <div class="log-list" id="log-list"><div style="color:#64748b;">暂无异常日志</div></div>
        </div>
    </div>

    <!-- ===== 区块链存证模块 ===== -->
    <div class="card" style="margin-top:20px;">
        <div class="flex-between">
            <h3>🔗 区块链存证 (不可篡改)</h3>
            <div>
                <button class="btn btn-success" id="mineBtn" onclick="triggerMine()">⛏️ 存证最新异常</button>
                <span style="margin-left:12px;font-size:14px;color:#94a3b8;">区块数: <span id="blockchain-length">0</span></span>
            </div>
        </div>
        <div class="blockchain-list" id="blockchain-list">
            <div style="color:#64748b;padding:8px 0;">暂无存证记录，点击上方按钮开始存证</div>
        </div>
    </div>
</div>

<script>
    const chartDom = document.getElementById('chart');
    const myChart = echarts.init(chartDom, 'dark');

    // ========== 1. 加载区块链列表 ==========
    async function loadBlockchain() {
        try {
            const res = await fetch('/api/blockchain/list');
            const data = await res.json();
            const listDiv = document.getElementById('blockchain-list');
            const lenSpan = document.getElementById('blockchain-length');
            lenSpan.innerText = data.length || 0;

            if (!data.chain || data.chain.length === 0) {
                listDiv.innerHTML = '<div style="color:#64748b;padding:8px 0;">暂无存证记录</div>';
                return;
            }

            // 从后往前显示（最新的在上面）
            const reversed = [...data.chain].reverse();
            listDiv.innerHTML = reversed.map(block => {
                let dataPreview = '—';
                try {
                    const parsed = JSON.parse(block.data);
                    dataPreview = parsed.log_preview || parsed.log_hash || block.data;
                } catch {
                    dataPreview = block.data;
                }
                return `
                    <div class="block-entry">
                        <span class="idx">#${block.index}</span>
                        <span style="color:#64748b;margin:0 8px;">|</span>
                        <span style="color:#94a3b8;">${block.timestamp.slice(5, 16)}</span>
                        <span style="color:#64748b;margin:0 8px;">|</span>
                        <span class="data">📄 ${dataPreview.slice(0, 60)}${dataPreview.length > 60 ? '…' : ''}</span>
                        <br>
                        <span class="hash">🔗 ${block.hash.slice(0, 20)}…${block.hash.slice(-8)}</span>
                        <span style="color:#64748b;font-size:11px;margin-left:8px;">prev: ${block.previous_hash.slice(0, 10)}…</span>
                    </div>
                `;
            }).join('');
        } catch (e) {
            console.error('加载区块链失败:', e);
        }
    }

    // ========== 2. 触发挖矿（存证异常） ==========
    async function triggerMine() {
        const btn = document.getElementById('mineBtn');
        btn.disabled = true;
        btn.innerText = '⏳ 存证中...';
        try {
            const res = await fetch('/api/blockchain/mine', { method: 'POST' });
            const result = await res.json();
            if (result.message) {
                alert(result.message);
            } else if (result.error) {
                alert('错误: ' + result.error);
            }
            // 刷新区块链列表
            await loadBlockchain();
            // 也刷新一下日志列表（因为可能有新日志）
            await loadLogs();
        } catch (e) {
            alert('请求失败: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '⛏️ 存证最新异常';
        }
    }

    // ========== 3. 加载异常日志 ==========
    async function loadLogs() {
        try {
            const res = await fetch('/api/logs?limit=5');
            const data = await res.json();
            const logList = document.getElementById('log-list');
            const logCount = document.getElementById('log-count');
            if (data.error || !data.logs || data.logs.length === 0) {
                logList.innerHTML = '<div style="color:#64748b;">暂无异常日志</div>';
                logCount.innerText = '0 条';
                logCount.className = 'badge ok';
            } else {
                logList.innerHTML = data.logs.map(line => 
                    `<div class="log-entry"><span class="time">${line.slice(0, 19)}</span>${line.slice(20)}</div>`
                ).join('');
                logCount.innerText = data.logs.length + ' 条';
                logCount.className = 'badge warn';
            }
        } catch (e) {
            console.error('加载日志失败:', e);
        }
    }

    // ========== 4. 加载监控数据 & 画图 ==========
    async function fetchAll() {
        try {
            // 历史数据
            const histRes = await fetch('/api/metrics?hours=6');
            const history = await histRes.json();
            const times = history.map(item => item.timestamp.slice(5, 16));
            const cpuData = history.map(item => item.cpu);
            const memData = history.map(item => item.memory);
            const diskData = history.map(item => item.disk || 0);

            // 最新数据
            const latestRes = await fetch('/api/latest');
            const latest = await latestRes.json();
            if (latest && !latest.error) {
                document.getElementById('cpu-latest').innerText = latest.cpu.toFixed(1) + '%';
                document.getElementById('mem-latest').innerText = latest.memory.toFixed(1) + '%';
                document.getElementById('disk-latest').innerText = (latest.disk || 0).toFixed(1) + '%';
                document.getElementById('time-latest').innerText = latest.timestamp;
            }

            // AI 预测
            const predRes = await fetch('/api/predict');
            const pred = await predRes.json();
            const predDiv = document.getElementById('predict-content');
            const statusBadge = document.getElementById('predict-status');
            if (pred.error) {
                predDiv.innerText = '⏳ ' + pred.error;
                statusBadge.className = 'badge ok';
                statusBadge.innerText = '数据不足';
            } else {
                predDiv.innerHTML = `
                    <div style="font-size:24px;font-weight:bold;color:${pred.alert ? '#f87171' : '#34d399'};">
                        ${pred.predicted_disk}%
                    </div>
                    <div style="color:#94a3b8;font-size:14px;">预计 1 小时后磁盘使用率</div>
                    <div class="alert-box ${pred.alert ? 'alert-danger' : 'alert-safe'}">
                        ${pred.alert ? '⚠️ 建议立即清理磁盘！' : '✅ 当前趋势平稳，暂无需处理。'}
                    </div>
                `;
                statusBadge.className = `badge ${pred.alert ? 'warn' : 'ok'}`;
                statusBadge.innerText = pred.alert ? '⚠️ 告警' : '✓ 正常';
            }

            // 画图
            myChart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['CPU', '内存', '磁盘'], textStyle: { color: '#94a3b8' } },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', data: times, axisLabel: { color: '#94a3b8', rotate: 30 } },
                yAxis: { type: 'value', min: 0, max: 100, axisLabel: { color: '#94a3b8', formatter: '{value}%' } },
                series: [
                    { name: 'CPU', type: 'line', smooth: true, data: cpuData, lineStyle: { color: '#38bdf8' }, areaStyle: { color: 'rgba(56,189,248,0.1)' } },
                    { name: '内存', type: 'line', smooth: true, data: memData, lineStyle: { color: '#a78bfa' }, areaStyle: { color: 'rgba(167,139,250,0.1)' } },
                    { name: '磁盘', type: 'line', smooth: true, data: diskData, lineStyle: { color: '#f59e0b' }, areaStyle: { color: 'rgba(245,158,11,0.1)' } }
                ]
            });
            myChart.resize();
        } catch (e) {
            console.error('刷新失败:', e);
        }
    }

    // ========== 5. 定时刷新 ==========
    async function refreshAll() {
        await fetchAll();
        await loadLogs();
        await loadBlockchain();
    }

    // 首次加载
    refreshAll();

    // 每 8 秒刷新一次（区块链不需要太频繁）
    setInterval(refreshAll, 8000);

    window.addEventListener('resize', () => myChart.resize());

    // 将 triggerMine 暴露到全局（HTML onclick 需要）
    window.triggerMine = triggerMine;
</script>
</body>
</html>
